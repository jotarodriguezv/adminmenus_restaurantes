# Corre las pruebas en cada push y en cada pull request.
#
# Se incluye 'push' y no solo 'pull_request' a propósito: los archivos de este
# repositorio se suben a veces directamente a main desde la web de GitHub, y
# esos cambios no pasan por ningún pull request. Sin esto, justo los que menos
# revisión tienen serían los únicos sin comprobar.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # La misma versión que usa la imagen de producción (node:22-alpine).
      # Si aquí se probara con otra, las pruebas podrían pasar sobre un Node
      # que no es el que acaba corriendo.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # 'npm ci' y no 'npm install': instala exactamente las versiones del
      # package-lock.json y falla si el lockfile y package.json se han
      # separado, en vez de resolver algo distinto en silencio.
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      # ── UN SEGUNDO INTENTO, Y SOLO CONTRA UN FALLO CONOCIDO ──────
      #
      # 'test/api.test.js' se cae de vez en cuando con un error que no es del
      # código:
      #
      #   not ok 1 - test/api.test.js
      #   error: 'Unable to deserialize cloned data due to invalid or
      #           unsupported version.'
      #
      # No habla del panel: es la fontanería del ejecutor de pruebas de Node,
      # que no consigue leer lo que el proceso hijo le manda. La señal que lo
      # delata es que el RECUENTO baja —el archivo se muere a mitad y sus
      # pruebas restantes ni se ejecutan— mientras que un fallo de verdad deja
      # el total intacto.
      #
      # Cuesta más de lo que parece: cada fallo manda un correo, y una falsa
      # alarma acaba haciendo desconfiar de un verde que sí valía.
      #
      # Se reintenta UNA vez y SOLO si el fallo trae ese mensaje. Un fallo de
      # verdad es determinista: vuelve a fallar, y aquí ni siquiera se
      # reintenta. Lo único que este reintento puede esconder es código de
      # producto genuinamente inestable, y no hay ninguno conocido.
      #
      # El primer intento se conserva en el registro a propósito: si esto
      # empieza a saltar a menudo, tiene que verse.
      #
      # Investigado el 06/09/2026 sin encontrar la causa. Lo descartado está en
      # CLAUDE.md, para no repetir el camino.
      - name: Ejecutar pruebas
        run: |
          set +e
          npm test 2>&1 | tee /tmp/pruebas1.log
          codigo=${PIPESTATUS[0]}
          set -e
          if [ "$codigo" -eq 0 ]; then exit 0; fi
          if grep -q "Unable to deserialize cloned data" /tmp/pruebas1.log; then
            echo "::warning::Primer intento roto por el fallo conocido del ejecutor de pruebas (no del código). Reintentando una vez."
            npm test
          else
            echo "Fallo real: no se reintenta."
            exit "$codigo"
          fi
